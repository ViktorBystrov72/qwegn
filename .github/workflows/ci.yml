name: ci

# Runs the repository's CI gate on GitHub Actions: toolchain check, full build,
# static/reachability lints, non-Metal/non-golden host & app test suites, and
# CLI smoke. Bare-metal GPU, golden-oracle, and performance suites run on real
# Apple Silicon machines (`GITHUB_ACTIONS != true`).
on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  gate:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26 or newer
        run: |
          # Pick the newest installed Xcode whose major version is 26 or higher.
          best=""
          for app in /Applications/Xcode*.app; do
            v=$(defaults read "$app/Contents/Info" CFBundleShortVersionString 2>/dev/null || echo 0)
            if [ "${v%%.*}" -ge 26 ] 2>/dev/null; then best="$app"; fi
          done
          test -n "$best" || { echo "FAIL: no Xcode 26+ on this runner"; exit 1; }
          sudo xcode-select -s "$best/Contents/Developer"
          xcodebuild -version

      - name: Install the Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain || true

      - name: Check toolchain
        run: ./Scripts/check_toolchain.sh

      - name: CI gate
        run: make ci
